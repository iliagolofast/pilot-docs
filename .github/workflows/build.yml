# Пересобирает data/ из content/ и i18n/ при каждом изменении статей
# и коммитит результат. GitHub Pages публикует ветку main как есть.
name: Сборка сайта

on:
  push:
    branches: [main]
    paths: ['content/**', 'i18n/**', 'gen.js', 'package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Закоммитить собранный сайт
        run: |
          git add data
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Сборка сайта"
          git push
