<title>Документация PILOT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Макет: шапка с поиском, слева дерево разделов, по центру статья, справа «На странице».
   Шрифт Inter — как в текущей справке PILOT; акцент — фирменный голубой из логотипа. */
:root{
  --bg:#ffffff; --bg-soft:#f4f7fa; --card:#ffffff; --line:#e2e8ef; --text:#17202b; --muted:#5c6b7c;
  --ink:#0b1420; --accent:#0284c7; --accent-strong:#0369a1; --accent-soft:#e6f3fb; --on-accent:#ffffff; --mark:#fff1a8;
  --focus:0 0 0 3px rgba(2,132,199,.35); --shadow:0 10px 30px rgba(15,35,60,.10); --bw:1px; --link-deco:none;
  --font:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --top:60px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --bg-soft:#141c25; --card:#17212c; --line:#26323f; --text:#e4ebf2; --muted:#94a3b4;
  --ink:#ffffff; --accent:#38bdf8; --accent-strong:#7dd3fc; --accent-soft:rgba(56,189,248,.13); --on-accent:#06202e; --mark:#5b4b00;
  --focus:0 0 0 3px rgba(56,189,248,.45); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141b; --bg-soft:#141c25; --card:#17212c; --line:#26323f; --text:#e4ebf2; --muted:#94a3b4;
  --ink:#ffffff; --accent:#38bdf8; --accent-strong:#7dd3fc; --accent-soft:rgba(56,189,248,.13); --on-accent:#06202e; --mark:#5b4b00;
  --focus:0 0 0 3px rgba(56,189,248,.45); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
/* Выбор в настройках документации важнее темы приложения */
:root[data-skin="light"]{
  --bg:#ffffff; --bg-soft:#f4f7fa; --card:#ffffff; --line:#e2e8ef; --text:#17202b; --muted:#5c6b7c;
  --ink:#0b1420; --accent:#0284c7; --accent-strong:#0369a1; --accent-soft:#e6f3fb; --on-accent:#ffffff; --mark:#fff1a8;
  --focus:0 0 0 3px rgba(2,132,199,.35); --shadow:0 10px 30px rgba(15,35,60,.10); color-scheme:light;
}
:root[data-skin="dark"]{
  --bg:#0e141b; --bg-soft:#141c25; --card:#17212c; --line:#26323f; --text:#e4ebf2; --muted:#94a3b4;
  --ink:#ffffff; --accent:#38bdf8; --accent-strong:#7dd3fc; --accent-soft:rgba(56,189,248,.13); --on-accent:#06202e; --mark:#5b4b00;
  --focus:0 0 0 3px rgba(56,189,248,.45); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
/* Контраст — отдельная настройка поверх любой темы: смешиваем цвет текста темы (--ink) с фоном */
:root[data-contrast="low"]{
  --text:color-mix(in srgb,var(--ink) 74%,var(--bg)); --muted:color-mix(in srgb,var(--ink) 50%,var(--bg));
  --line:color-mix(in srgb,var(--ink) 7%,var(--bg));
}
:root[data-contrast="high"]{
  --text:var(--ink); --muted:color-mix(in srgb,var(--ink) 88%,var(--bg)); --line:color-mix(in srgb,var(--ink) 75%,var(--bg));
  --accent:var(--accent-strong); --bw:2px; --link-deco:underline; --shadow:none;
}
:root[data-font="m"]{font-size:112.5%}
:root[data-font="l"]{font-size:125%}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.65 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent);text-decoration:var(--link-deco)}
a:hover{text-decoration:underline}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
button{font:inherit;color:inherit}
kbd{font:500 .72rem var(--font);border:var(--bw) solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
h1,h2,h3{text-wrap:balance;line-height:1.25}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.logo:hover{text-decoration:none}
.logo svg{height:22px;width:auto;flex:none}
.logo span{color:var(--accent);font-weight:600}
.ver{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.search-btn{flex:0 1 380px;margin-left:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--bg-soft);border:var(--bw) solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted);cursor:pointer;font-size:.9rem;min-width:0}
.search-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.is-home .search-btn{visibility:hidden}
.spacer{flex:1}
.top-link{color:var(--muted);font-size:.9rem;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lang{position:relative;flex:none;display:flex;align-items:center;color:var(--muted)}
.lang svg{position:absolute;pointer-events:none;width:16px;height:16px}
.lang .globe{inset-inline-start:11px}.lang .chev{inset-inline-end:10px;width:12px;height:12px}
.lang select{appearance:none;-webkit-appearance:none;height:38px;border-radius:9px;background:none;border:var(--bw) solid var(--line);color:var(--text);font:inherit;font-size:.88rem;padding-block:0;padding-inline:34px 30px;cursor:pointer}
.lang select:hover{border-color:var(--accent)}
.lang select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fallback{margin:0 0 20px;padding:10px 14px;border-radius:8px;background:var(--bg-soft);color:var(--muted);font-size:.9rem}
.fallback:empty{display:none}
.icon-btn{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:none;border:var(--bw) solid var(--line);color:var(--text);cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}

/* главная */
.home{max-width:880px;margin:0 auto;padding-block:56px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home h1{font-size:2.3rem;margin:0 0 6px;text-align:center;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px;text-align:center}
.home-search{display:flex;gap:8px;background:var(--card);border:var(--bw) solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.home-search input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:1.05rem;padding:8px 10px;outline:none}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:9px 18px;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 36px}
.chip{background:var(--bg-soft);border:var(--bw) solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.tags-box{margin:-12px 0 32px}
.tags-head{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tags-head button{border:0;background:none;color:var(--accent);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{display:inline-flex;align-items:center;gap:6px;border:var(--bw) solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:.84rem;cursor:pointer;color:var(--text);text-decoration:none}
.tag small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.74rem}
.tag:hover{border-color:var(--accent);text-decoration:none}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag[aria-pressed="true"] small{color:var(--on-accent);opacity:.8}
.has-tags .grid{display:none}
.art-tags{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 20px}
.art-tags:empty{display:none}
.art-tags .tag{font-size:.78rem;padding:2px 9px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--card);border:var(--bw) solid var(--line);border-radius:12px;padding:16px;color:var(--text);text-decoration:none}
.tile:hover{border-color:var(--accent);text-decoration:none}
.tile b{font-weight:600}
.tile small{color:var(--muted);font-variant-numeric:tabular-nums}
.has-query .grid{display:none}

/* результаты */
.results{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.results:empty{display:none}
.home .results{margin-bottom:32px}
.results a{display:block;padding:12px 14px;border:var(--bw) solid var(--line);border-radius:10px;background:var(--card);color:var(--text);text-decoration:none}
.results a:hover,.results a.sel{border-color:var(--accent);background:var(--accent-soft)}
.results .c{font-size:.76rem;color:var(--muted)}
.results .t{font-weight:600;color:var(--accent)}
.results .x{font-size:.87rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.results mark{background:var(--mark);color:inherit;border-radius:2px}
.results .empty{color:var(--muted);padding:10px 4px}

/* статья */
.doc{display:grid;grid-template-columns:290px minmax(0,1fr) 230px;min-height:calc(100vh - var(--top))}
.sidebar{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));overflow:auto;
  background:var(--bg-soft);border-right:var(--bw) solid var(--line);padding:14px 10px 40px;font-size:.89rem}
.nav,.nav ul{list-style:none;margin:0;padding:0}
.nav ul{padding-left:12px;border-left:var(--bw) solid var(--line);margin-left:11px}
.nav .row{display:flex;align-items:flex-start}
.nav .tw{flex:none;width:22px;height:28px;display:grid;place-items:center;background:none;border:0;color:var(--muted);cursor:pointer;border-radius:5px}
.nav .tw svg{width:12px;height:12px;transition:transform .15s}
.nav li.open>.row .tw svg{transform:rotate(90deg)}
.nav .tw.none{visibility:hidden}
.nav a{flex:1;min-width:0;display:block;padding:4px 8px;border-radius:6px;color:var(--text);text-decoration:none}
.nav a:hover{background:var(--accent-soft)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
:root[data-contrast="high"] .nav a.active{outline:2px solid var(--accent)}
.nav li>ul{display:none}
.nav li.open>ul{display:block}
.article{min-width:0;padding-block:28px 80px;padding-left:max(16px,min(56px,4vw));padding-right:max(16px,min(56px,4vw))}
.article-inner{max-width:820px;margin-inline:auto}
.crumbs{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px}
.crumbs a{color:var(--muted)}
.article h1{font-size:2rem;margin:6px 0 20px;letter-spacing:-.01em}
.body h2{margin-top:2em;scroll-margin-top:calc(var(--top) + 20px)}
.body h3{margin-top:1.6em;scroll-margin-top:calc(var(--top) + 20px)}
.body img{display:block;max-width:min(100%,520px);max-height:320px;width:auto;height:auto;object-fit:contain;transition:border-color .15s,box-shadow .15s;margin:12px 0;border:var(--bw) solid var(--line);border-radius:8px;cursor:zoom-in;background:var(--bg-soft)}
.body img[data-missing]{display:none}
.body img:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.body .tbl{overflow-x:auto;margin:16px 0}
.body table{border-collapse:collapse;min-width:100%;font-size:.92rem}
.body th,.body td{border:var(--bw) solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.body th{background:var(--bg-soft)}
.body td img{margin:4px 0}
.body blockquote{margin:16px 0;padding:10px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px}
.body code{font-family:var(--mono);font-size:.86em;background:var(--bg-soft);border:var(--bw) solid var(--line);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
.body pre{background:var(--bg-soft);border:var(--bw) solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.body pre code{border:0;padding:0;background:none}
.body a.dead{color:var(--muted);text-decoration:line-through}
.body p,.body li{overflow-wrap:break-word}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px}
.pager a{border:var(--bw) solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);text-decoration:none;min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager .next{text-align:right;grid-column:2}
.pager small{display:block;color:var(--muted);font-size:.78rem}
.toc{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - var(--top));overflow:auto;padding:28px 16px;font-size:.84rem}
.toc b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.toc a{display:block;color:var(--muted);padding:3px 0}
.toc a.h3{padding-left:12px}
.loading{color:var(--muted);padding:40px 0}

/* диалоги */
.dialog{position:fixed;inset:0;z-index:40;background:rgba(8,14,22,.5);display:flex;align-items:flex-start;justify-content:center;
  padding-top:max(8vh,calc(env(safe-area-inset-top,0px) + 16px));padding-bottom:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.box{background:var(--card);color:var(--text);border:var(--bw) solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(460px,100%);max-height:84vh;overflow:auto;padding:20px 22px}
.search-box{width:min(680px,100%);padding:12px}
.search-input{width:100%;border:var(--bw) solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:1.05rem;background:var(--bg-soft);color:var(--text);margin-bottom:10px}
.box h2{margin:0 0 14px;font-size:1.2rem}
fieldset{border:0;padding:0;margin:0 0 16px;display:grid;gap:6px}
legend{font-weight:600;margin-bottom:6px;padding:0}
fieldset label{display:flex;align-items:center;gap:10px;padding:8px 12px;border:var(--bw) solid var(--line);border-radius:9px;cursor:pointer}
fieldset label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
fieldset small{color:var(--muted);margin-left:auto;font-size:.8rem}
.actions{display:flex;justify-content:flex-end}
.lightbox{align-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;border-radius:8px;background:#fff}

@media (max-width:1180px){.doc{grid-template-columns:270px minmax(0,1fr)}.toc{display:none}}
@media (max-width:820px){
  .menu-btn{display:grid}
  .top-link,.ver,.search-btn kbd{display:none}
  .lang select{padding-inline:30px 24px}
  .search-btn{min-width:0;overflow:hidden}.search-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logo span{display:none}
  .search-btn{margin-left:4px}
  .doc{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:25;left:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(320px,88vw);transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-left:max(10px,env(safe-area-inset-left,0px))}
  .nav-open .sidebar{transform:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  .home{padding-block:32px 56px}.home h1{font-size:1.8rem}
  .article h1{font-size:1.6rem}
  .pager{grid-template-columns:1fr}.pager .next{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- интерактивные экраны PILOT (раздел «С чего начать») ---------- */
.demo-fig{margin:20px 0 24px;container-type:inline-size;container-name:demo}
.app{
  --a-page:#eef0f2; --a-bg:#ffffff; --a-soft:#f4f5f6; --a-field:#f3f4f5; --a-line:#e7e9eb; --a-text:#2a2e33; --a-muted:#7b828a; --a-blue:#0f7cc4; --a-blue-soft:#e4f1fb; --a-sel:#e9f4fc; --a-sel-line:#62ade3;
  --a-green:#1e9e4a; --a-red:#e53935;
  --m-land:#f5f3f0; --m-bld:#e9e6e1; --m-bld-s:#dcd8d1; --m-park:#cdeac4; --m-park2:#d9efd2; --m-water:#9fd0f3; --m-road:#ffffff; --m-case:#dcdcdc; --m-hw:#fcd773; --m-hw-case:#ebb740; --m-text:#5f6368; --m-halo:#ffffff;
  position:relative;overflow:hidden;border:var(--bw) solid var(--line);border-radius:12px;background:var(--a-page);color:var(--a-text);
  font:11.5px/1.35 Roboto,var(--font);user-select:none;-webkit-user-select:none;height:430px;display:flex;flex-direction:column;
}
.app.tall{height:500px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-skin="light"]) .app{
  --a-page:#11181f; --a-bg:#1a232c; --a-soft:#212c37; --a-field:#24303b; --a-line:#2e3b48; --a-text:#e2e8ee; --a-muted:#98a5b3; --a-blue:#3aa7ea; --a-blue-soft:rgba(58,167,234,.16); --a-sel:rgba(58,167,234,.14); --a-sel-line:#3a8fc9;
  --m-land:#242f3e; --m-bld:#2c394a; --m-bld-s:#34445a; --m-park:#26412f; --m-park2:#2a3d33; --m-water:#17263c; --m-road:#3a4656; --m-case:#2a3442; --m-hw:#7d6835; --m-hw-case:#5e4d27; --m-text:#b3bdc8; --m-halo:#1b2430; --a-veh:#9aa6b2;
}}
:root[data-theme="dark"]:not([data-skin="light"]) .app, :root[data-skin="dark"] .app{
  --a-page:#11181f; --a-bg:#1a232c; --a-soft:#212c37; --a-field:#24303b; --a-line:#2e3b48; --a-text:#e2e8ee; --a-muted:#98a5b3; --a-blue:#3aa7ea; --a-blue-soft:rgba(58,167,234,.16); --a-sel:rgba(58,167,234,.14); --a-sel-line:#3a8fc9;
  --m-land:#242f3e; --m-bld:#2c394a; --m-bld-s:#34445a; --m-park:#26412f; --m-park2:#2a3d33; --m-water:#17263c; --m-road:#3a4656; --m-case:#2a3442; --m-hw:#7d6835; --m-hw-case:#5e4d27; --m-text:#b3bdc8; --m-halo:#1b2430; --a-veh:#9aa6b2;
}
.app button{font:inherit;color:inherit;cursor:pointer}
.app svg{flex:none}
/* верхняя панель */
.a-top{display:flex;align-items:center;gap:4px;height:40px;padding:0 10px;flex:none;background:var(--a-bg);border-bottom:1px solid var(--a-line)}
.a-logo{display:flex;align-items:center;gap:5px;margin-inline-end:10px}
.a-logo svg{width:20px;height:20px}
.a-logo b{font:900 15px/1 'Arial Black',Roboto,var(--font);letter-spacing:.01em}
.a-tabs{display:flex;gap:2px;min-width:0}
.a-tab{display:flex;align-items:center;gap:5px;border:0;background:none;padding:5px 7px;border-radius:4px;color:var(--a-text);white-space:nowrap;font-size:11px}
.a-tab svg{width:13px;height:13px;color:var(--a-muted)}
.a-tab.on{background:var(--a-blue-soft);color:var(--a-blue)}
.a-tab.on svg{color:var(--a-blue)}
.a-tab:hover{background:var(--a-soft)}
.a-sp{flex:1}
.a-stat{display:flex;gap:3px}
.a-stat span{min-width:19px;height:19px;padding:0 3px;border-radius:3px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.a-user{display:flex;align-items:center;gap:5px;margin:0 6px 0 8px;font-size:10.5px;white-space:nowrap}
.a-user svg{width:16px;height:16px;color:var(--a-muted)}
.a-user span{display:flex;flex-direction:column;line-height:1.2}
.a-user small{color:var(--a-muted)}
.a-ico{border:0;background:none;width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--a-muted);flex:none;position:relative}
.a-ico svg{width:14px;height:14px}
.a-ico:hover{background:var(--a-soft);color:var(--a-text)}
.a-ico.dim{opacity:.45}
.a-bell i{position:absolute;top:0;inset-inline-end:0;min-width:12px;height:12px;border-radius:6px;background:var(--a-red);color:#fff;font:600 8px/12px Roboto,var(--font);font-style:normal}
/* тело: полоса слева, панель, карта */
.a-body{flex:1;display:flex;min-height:0;position:relative;gap:6px;padding:6px 6px 6px 0}
.a-rail{width:32px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.a-rail span{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:var(--a-muted)}
.a-rail span.on{background:var(--a-blue-soft);color:var(--a-blue)}
.a-rail span.dn{margin-top:auto}
.a-rail svg{width:14px;height:14px}
.a-panel{width:56%;min-width:0;display:flex;flex-direction:column;background:var(--a-bg);border-radius:6px;overflow:hidden}
.a-ph{display:flex;align-items:center;gap:2px;padding:8px 10px 6px;flex:none}
.a-ph h4{margin:0;font-size:15px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-tb{display:flex}
.a-lnk{display:flex;align-items:center;gap:4px;color:var(--a-muted);font-size:10.5px;margin-inline-end:4px;white-space:nowrap}
.a-lnk svg{width:12px;height:12px}
.a-flt{display:flex;gap:5px;padding:0 10px 6px;flex:none}
.a-dd,.a-sr{display:flex;align-items:center;gap:3px;background:var(--a-field);border-radius:4px;height:24px;padding:0 6px;color:var(--a-muted);min-width:0}
.a-dd svg{width:12px;height:12px}
.a-dd svg+svg{width:10px;height:10px}
.a-all{flex:1 1 70px;justify-content:space-between;color:var(--a-text)}
.a-sr{flex:1 1 90px}
.a-sr i{flex:1}
.a-sr svg{width:11px;height:11px}
/* таблица объектов */
.a-th,.a-row{display:grid;grid-template-columns:16px 26px minmax(0,1fr) minmax(0,1.3fr) 84px 26px 28px;align-items:center;gap:0 5px;padding:0 10px}
.a-th{height:22px;border-bottom:1px solid var(--a-line);color:var(--a-muted);font-size:10px;flex:none}
.a-th span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-th .c3{grid-column:1/4}
.a-th .nb{display:flex;gap:4px;justify-content:flex-end}
.a-th .nb svg{width:11px;height:11px}
.a-th.short,.a-row.short{grid-template-columns:16px 26px minmax(0,1fr) 60px}
.a-list{flex:1;overflow:auto;position:relative;min-height:0}
.a-grp{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;font-size:11px}
.a-grp svg{width:11px;height:11px;color:var(--a-muted)}
.a-row{height:25px;cursor:pointer;border-top:1px solid transparent;border-bottom:1px solid transparent;padding-inline-start:22px}
.a-row.short{padding-inline-start:22px}
.a-row:hover{background:var(--a-soft)}
.a-row.sel{background:var(--a-sel);border-color:var(--a-sel-line)}
.a-row.new{animation:a-flash 1.6s ease}
@keyframes a-flash{0%,40%{background:#fff3b0}100%{background:transparent}}
.a-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-row .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.a-row .st.off{color:var(--a-muted)}
.a-row .tm{font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.a-row .tg{display:flex;gap:1px}
.a-row .tg i{width:9px;height:9px;border-radius:2px}
.a-row .nb{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:10.5px}
.a-row .nb svg{width:11px;height:11px;color:var(--a-muted)}
.a-row .a-kebab{position:absolute;inset-inline-end:2px;width:20px;height:20px;background:var(--a-bg)}
.a-row{position:relative}
.a-cb{width:12px;height:12px;border:1.3px solid #a3a9b0;border-radius:2px;display:inline-grid;place-items:center;background:var(--a-bg);flex:none}
.a-cb.on{border-color:var(--a-blue)}
.a-cb.on::after{content:"";width:6px;height:3px;border:1.6px solid var(--a-blue);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.a-car{width:22px;height:12px;color:var(--a-veh,#55606b)}
/* карта */
.a-map{flex:1;position:relative;background:var(--m-land);min-width:0;overflow:hidden;border-radius:6px;cursor:grab}
.a-map.drag{cursor:grabbing}
.a-map svg.m{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.a-map .ml{fill:var(--m-land)}
.a-map .mp{fill:var(--m-park)}
.a-map .mpk{stroke:var(--m-park2)}
.a-map .mw{stroke:var(--m-water)}
.a-map .mwf{fill:var(--m-water)}
.a-map .mb{fill:var(--m-bld);stroke:var(--m-bld-s);stroke-width:.8}
.a-map .mc{stroke:var(--m-case)}
.a-map .mr{stroke:var(--m-road)}
.a-map .mh{stroke:var(--m-hw)}
.a-map .mhc{stroke:var(--m-hw-case)}
.a-map .mtraffic{display:none;fill:none;stroke-width:6;stroke-linecap:round}
.a-map .tr-on .mtraffic{display:inline}
.a-map .mstreet{display:none;fill:none;stroke:#4a9df0;stroke-width:4;opacity:.75}
.a-map .sv-on .mstreet{display:inline}
.a-map text{font-family:Roboto,Arial,var(--font);paint-order:stroke;stroke:var(--m-halo);stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.a-map .mt{font-size:10px;fill:var(--m-text);stroke-width:3px}
.a-map .mtb{font-weight:600;fill:#7a5a13;font-size:10.5px}
.a-map .mtw{font-size:12px;font-style:italic;fill:#3f7ab3;stroke-width:3px;letter-spacing:.06em}
.a-map .mtp{font-size:10.5px;fill:#2e7d32;stroke-width:3px;font-weight:500}
.a-map .mtd{font-size:12px;fill:#9aa0a6;stroke-width:3px;letter-spacing:.18em;font-weight:500}
.a-map .mtl{font-size:9.5px;text-anchor:start;stroke-width:2.5px;font-weight:500}
.a-map .mpi{font-size:8.5px;fill:#fff;stroke:none;font-weight:700}
.a-mk{position:absolute;inset:0;pointer-events:none}
.a-veh{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;pointer-events:auto;display:grid;place-items:center;transition:left 1s linear,top 1s linear;z-index:1}
.drag .a-veh{transition:none}
.a-veh .dot{width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);position:relative;z-index:1}
.a-veh .dot svg{width:15px;height:9px}
.a-veh .dot svg circle:nth-child(odd){fill:var(--c)}
.a-veh .dir{position:absolute;width:30px;height:30px;display:none}
.a-veh.mv .dir{display:block}
.a-veh .dir::before{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);border:5px solid transparent;border-bottom:7px solid var(--c);border-top:0}
.a-veh .lb{position:absolute;top:24px;left:50%;transform:translateX(-50%);background:var(--a-bg);color:var(--a-text);border-radius:3px;padding:0 4px;font-size:9.5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.a-veh.sel{z-index:3}
.a-veh.sel .dot{box-shadow:0 0 0 4px rgba(15,124,196,.35),0 1px 4px rgba(0,0,0,.35)}
.a-tip{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:var(--a-bg);color:var(--a-text);border-radius:6px;padding:6px 9px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.22);font-size:10.5px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:start}
.a-tip b{font-size:11.5px}
.a-tip small{color:var(--a-muted)}
.a-mtop{position:absolute;top:6px;right:6px;display:flex;gap:4px;font-size:10px;z-index:2}
.a-mtop>*{background:var(--a-bg);border-radius:3px;padding:2px 6px;box-shadow:0 1px 3px rgba(0,0,0,.2);display:flex;align-items:center;gap:3px;white-space:nowrap;cursor:pointer}
.a-mtop input{margin:0;width:11px;height:11px}
.a-mtools{position:absolute;right:5px;bottom:26px;display:flex;flex-direction:column;gap:1px;z-index:2}
.a-mtools>*{width:22px;height:22px;border:0;border-radius:3px;background:var(--a-bg);display:grid;place-items:center;color:#666;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.a-mtools svg{width:13px;height:13px}
.a-mcoord{position:absolute;right:5px;bottom:4px;background:var(--a-bg);border-radius:3px;padding:1px 5px;font-size:9.5px;font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgba(0,0,0,.18);z-index:2}
/* кнопки и поля */
.a-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:4px;padding:0 12px;height:28px;background:var(--a-blue);color:#fff !important;font-weight:500;white-space:nowrap;flex:none}
.a-btn svg{width:13px;height:13px}
.a-btn:disabled{background:none;color:var(--a-muted) !important;opacity:.6;cursor:not-allowed}
.a-btn.soft{background:var(--a-soft);color:var(--a-text) !important}
.a-btn.sq{width:32px;padding:0}
.a-field{display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.a-field label{font-size:9.5px;color:var(--a-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-field input,.a-field select{font:inherit;color:var(--a-text);background:var(--a-field);border:1px solid transparent;border-radius:4px;padding:0 7px;height:28px;min-width:0;width:100%;outline:none}
.a-field select:disabled{opacity:.7}
.a-field input::placeholder{color:var(--a-muted)}
.a-field input:focus,.a-field select:focus{border-color:var(--a-blue);background:var(--a-bg)}
.a-field.err input,.a-field.err select{border-color:#e57373}
.a-field .em{color:var(--a-red);font-size:10px;min-height:13px}
.a-dd2 svg{position:absolute;inset-inline-end:7px;bottom:8px;width:12px;height:12px;color:var(--a-muted);pointer-events:none}
.a-plain select{background:none;border:0;width:130px}
.a-chk{display:flex;gap:6px;align-items:center;font-size:11px;white-space:nowrap}
.a-chk input{margin:0;width:13px;height:13px;accent-color:var(--a-blue)}
.a-row2{display:flex;gap:6px;align-items:flex-end;min-width:0}
.a-col{flex:none}
.a-colr{display:flex;align-items:center;gap:2px;height:28px}
.a-colr svg:last-child{width:11px;height:11px;color:var(--a-muted)}
.a-colr .a-car{width:26px;height:14px}
.a-chips{display:flex;gap:4px;align-items:center;height:28px;background:var(--a-field);border-radius:4px;padding:0 5px;overflow:hidden}
.a-chips b{color:#fff;font-weight:500;font-size:10px;border-radius:3px;padding:2px 5px;white-space:nowrap}
.a-checks{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;margin-top:10px}
.a-checks.row{display:flex;gap:18px;margin:0;padding:0 10px 8px}
/* модальные окна */
.a-modal-bg{position:absolute;inset:0;background:rgba(10,20,30,.32);display:flex;align-items:center;justify-content:center;z-index:5;padding:10px}
.a-modal{background:var(--a-bg);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:a-pop .18s ease}
.a-modal.mid{max-width:620px}
.a-modal.wide{max-width:780px;height:100%}
@keyframes a-pop{from{transform:scale(.97);opacity:0}}
.a-mh{display:flex;align-items:center;gap:4px;padding:9px 12px 7px;font-size:13px;flex:none}
.a-mh>span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-agent{font-size:10.5px;margin-inline-end:6px;white-space:nowrap}
.a-mb{padding:4px 14px 10px;overflow:auto;flex:1;min-height:0}
.a-mb.flush{padding:0;display:flex;flex-direction:column}
.a-mb h5{margin:4px 0 12px;font-size:13.5px;font-weight:500}
.a-mf{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--a-line);flex:none}
.a-mf .warn{flex:1;color:var(--a-red);font-size:10.5px;display:flex;align-items:center;gap:5px;min-width:0}
.a-mf .warn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-mf .warn i{font-weight:400}
.a-mf .warn.ok{color:var(--a-green)}
.app .warn svg{width:14px;height:14px;flex:none}
.a-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 8px;align-items:end}
.a-grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.a-grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.a-more .a-grid.g2{margin-top:10px}
.a-side{display:flex;flex:1;min-height:0}
.a-side nav{width:128px;flex:none;padding:4px 0;display:flex;flex-direction:column;gap:1px;background:var(--a-soft)}
.a-side nav span{padding:6px 10px;color:var(--a-text);display:flex;gap:8px;align-items:center;font-size:11px;border-inline-end:2px solid transparent}
.a-side nav span svg{width:13px;height:13px;color:var(--a-muted)}
.a-side nav span.on{background:var(--a-bg);font-weight:500;border-inline-end-color:var(--a-blue)}
.a-side nav span.on svg{color:var(--a-blue)}
.a-sh{display:flex;align-items:center;gap:4px;padding:8px 10px;flex:none}
.a-sh h5{margin:0 10px 0 0;font-size:14px;font-weight:500}
.a-sel{display:flex;align-items:center;justify-content:space-between;gap:6px;width:150px;height:24px;background:var(--a-field);border-radius:4px;padding:0 7px;color:var(--a-muted)}
.a-sel svg{width:11px;height:11px}
.a-menu{position:absolute;z-index:4;background:var(--a-bg);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.22);padding:4px 0;min-width:180px;animation:a-pop .12s ease}
.a-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:5px 12px;text-align:start;font-size:11px}
.a-menu button:hover{background:var(--a-soft)}
.a-menu svg{width:13px;height:13px;color:#555}
.app .a-tbl{width:100%;min-width:0;border-collapse:collapse;font-size:10.5px}
.app .a-tbl th{font-weight:400;color:var(--a-muted);text-align:start;vertical-align:middle;padding:4px 7px;border:0;border-bottom:1px solid var(--a-line);border-inline-end:1px solid var(--a-line);white-space:nowrap;position:sticky;top:0;background:var(--a-bg);z-index:1}
.app .a-tbl td{padding:0 7px;height:24px;text-align:start;vertical-align:middle;border-inline:0;white-space:nowrap;font-variant-numeric:tabular-nums;max-width:160px;overflow:hidden;text-overflow:ellipsis;border-top:1px solid transparent;border-bottom:1px solid transparent}
.app .a-tbl .r{text-align:end}
.a-tbl td.tr{width:24px;color:var(--a-muted)}
.a-tbl td.tr svg{width:13px;height:13px;vertical-align:middle}
.a-tbl td.mut{color:var(--a-muted);white-space:normal}
.a-tbl tr.sel td{background:var(--a-sel);border-color:var(--a-sel-line)}
.a-tbl tr.click{cursor:pointer}
.a-tbl tr.click:hover td{background:var(--a-soft)}
.a-tbl tr.g td{font-size:10.5px}
.a-tbl tr.g svg{width:10px;height:10px;vertical-align:middle;color:var(--a-muted)}
.a-tbl .a-cb{vertical-align:middle}
/* история */
.a-dates{display:flex;align-items:flex-end;gap:8px;padding:0 10px 8px;flex:none}
.a-dt{display:flex;gap:8px;flex:1;min-width:0}
.a-dt .a-field{flex:1}
.a-date{position:relative;display:block}
.a-date svg{position:absolute;inset-inline-end:6px;top:8px;width:12px;height:12px;color:var(--a-muted);pointer-events:none}
.a-hp{width:52%}
.a-trips{flex:1.3}
.a-player{display:flex;align-items:center;gap:2px;padding:4px 8px;border-top:1px solid var(--a-line);flex:none}
.a-player input[type=range]{flex:1;accent-color:var(--a-blue);min-width:0;margin:0 4px}
.a-rate{border:0;background:none;font-size:10.5px;min-width:24px;color:var(--a-text)}
.a-etabs{display:flex;gap:2px;padding:4px 8px 0;border-top:1px solid var(--a-line);flex:none}
.a-etabs span{padding:4px 10px;font-size:10.5px;color:var(--a-muted);border-bottom:2px solid transparent}
.a-etabs span.on{color:var(--a-text);border-color:var(--a-blue)}
.a-evs{flex:1}
.a-hright{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.a-chart{height:76px;background:var(--a-bg);border-radius:6px;position:relative;flex:none;padding:16px 6px 4px}
.a-chart svg{position:absolute;inset:18px 6px 4px;width:calc(100% - 12px);height:calc(100% - 22px)}
.a-leg{position:absolute;top:3px;inset-inline-start:8px;font-size:9.5px;display:flex;align-items:center;gap:5px;color:var(--a-muted)}
.a-leg i{width:14px;height:2px;background:#1a73e8}
/* отчёты */
.a-rp{width:46%}
.a-rpf{padding:0 10px 6px}
.a-bline{display:flex;align-items:center;gap:8px;padding:0 10px 8px;flex:none}
.a-bline .warn{flex:1;color:var(--a-muted);font-size:10px}
.a-rright{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.a-mapcard{flex:1;display:flex;flex-direction:column;background:var(--a-bg);border-radius:6px;overflow:hidden;min-height:0}
.a-ct{padding:5px 10px;font-size:12px;flex:none}
.a-mapcard .a-map{border-radius:0}
.a-mapcard .a-mtools span,.a-mapcard .a-mtop label{display:none}
.a-mapcard .a-mtools{bottom:24px}
.a-res{display:none;flex:1.35;flex-direction:column;background:var(--a-bg);border-radius:6px;overflow:hidden;min-height:0}
.has-res .a-res{display:flex}
.a-rtab{display:flex;padding:4px 8px 0;border-bottom:1px solid var(--a-line);flex:none}
.a-rtab span{display:flex;align-items:center;gap:6px;padding:3px 4px 4px 10px;font-size:10.5px;border-bottom:2px solid var(--a-blue)}
.a-x{border:0;background:none;width:16px;height:16px;display:grid;place-items:center;color:var(--a-muted)}
.a-x svg{width:10px;height:10px}
.a-rhead{display:flex;flex-direction:column;gap:5px;padding:6px 10px;font-size:10.5px;flex:none}
.a-pillo{background:var(--a-soft);border-radius:3px;padding:1px 6px}
.a-rfoot{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--a-line);flex:none}
.a-rfoot .a-btn{height:24px;font-size:10.5px}
.a-toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#1f2733;color:#fff;border-radius:6px;padding:7px 12px;font-size:11.5px;z-index:9;white-space:nowrap;animation:a-pop .15s ease}
.a-center{flex:1;display:flex;align-items:center;justify-content:center;padding:12px}
.a-soon{color:var(--a-muted);background:var(--a-soft);margin:0 10px 10px;border-radius:6px}
/* вход */
.a-lpage{background:var(--a-page)}
.a-login{width:100%;max-width:340px;background:var(--a-bg);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.07);padding:14px 18px 0;display:flex;flex-direction:column;gap:8px}
.a-login .lt{display:flex;justify-content:space-between;align-items:center}
.a-login .big{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 4px}
.a-login .big svg{width:46px;height:46px}
.a-login .big b{font:900 34px/1 'Arial Black',Roboto,var(--font);letter-spacing:.01em}
.a-login .lb{display:flex;justify-content:space-between;gap:8px;margin:4px -18px 0;padding:10px 18px;border-top:1px solid var(--a-line)}
.a-login .a-btn.wide{min-width:120px}
.a-spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:a-rot .7s linear infinite}
@keyframes a-rot{to{transform:rotate(360deg)}}
/* номера-выноски и подсветка */
[data-n]{position:relative}
.app:has(>.a-modal-bg) .a-num{display:none}.app .a-modal-bg .a-num{display:block}
.a-num{position:absolute;top:-7px;inset-inline-start:-7px;width:17px;height:17px;border-radius:50%;background:#16a06a;color:#fff;font:700 10px/17px var(--font);text-align:center;z-index:6;pointer-events:none;box-shadow:0 0 0 2px var(--a-bg)}
.app .a-num.in{top:2px;inset-inline-end:2px;inset-inline-start:auto}
.app .a-player>.a-num.in{inset-inline-end:auto;inset-inline-start:50%}
.app .a-map>.a-num.in{top:32px}
.hl{outline:2px solid #16a06a !important;outline-offset:2px;border-radius:6px;animation:a-pulse 1.2s ease infinite}
@keyframes a-pulse{50%{outline-color:rgba(22,160,106,.35)}}
.demo-cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline;margin-top:8px;font-size:.86rem;color:var(--muted)}
.demo-cap>span:first-child{flex:1 1 260px}
.a-cursor{position:absolute;left:0;top:0;width:18px;height:22px;z-index:20;pointer-events:none;transition:transform .6s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.a-cursor svg{width:18px;height:22px;display:block}
.a-cursor i{position:absolute;left:-9px;top:-9px;width:20px;height:20px;border-radius:50%;background:rgba(15,124,196,.45);opacity:0;transform:scale(.3)}
.a-cursor.tap i{animation:a-tap .45s ease-out}
@keyframes a-tap{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.demo-cap .a-auto{border:var(--bw) solid var(--line);background:var(--bg-soft);color:var(--text);border-radius:999px;padding:2px 10px;font-size:.74rem;cursor:pointer;white-space:nowrap;margin-inline-start:auto}
.demo-cap .hint{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
.demo-steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.demo-steps button{display:flex;align-items:center;gap:6px;border:var(--bw) solid var(--line);background:var(--bg-soft);border-radius:999px;padding:3px 10px 3px 4px;font-size:.82rem;cursor:pointer;color:var(--text)}
.demo-steps button:hover,.demo-steps button.on{border-color:#16a06a}
.demo-steps b{width:18px;height:18px;border-radius:50%;background:#16a06a;color:#fff;font-size:.68rem;display:grid;place-items:center}
@container demo (max-width:880px){
  .a-user{display:none}
}
@container demo (max-width:780px){
  .a-stat{display:none}
  .a-th,.a-row{grid-template-columns:16px 26px minmax(0,1fr) minmax(0,1fr) 30px}
  .a-th>span:nth-child(3),.a-th>span:nth-child(4),.a-row .tm,.a-row .tg{display:none}
  .a-th.short,.a-row.short{grid-template-columns:16px 26px minmax(0,1fr) 50px}
  .a-row.short .tg,.a-th.short>span:nth-child(2){display:flex}
}
@container demo (max-width:600px){
  .app{height:460px}.app.tall{height:560px}
  .a-rail{display:none}
  .a-body{padding:6px}
  .a-panel,.a-rp,.a-hp{width:100%}
  .a-body>.a-map{display:none}
  .a-tab span{display:none}
  .a-th,.a-row{grid-template-columns:16px 26px minmax(0,1fr) 28px}
  .a-th>span:nth-child(2),.a-row .st{display:none}
  .a-flt .a-dd:not(.a-all){display:none}
  .a-grid,.a-grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .a-grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .a-side nav{display:none}
  .a-checks{grid-template-columns:1fr}
  .a-hist .a-body{flex-direction:column}
  .a-hist .a-body>.a-map{display:block;flex:none;height:170px}
  .a-hist .a-hright{flex:none;height:220px}
  .a-hist .a-hp{flex:1;min-height:0}
  .a-hist .a-etabs,.a-hist .a-evs{display:none}
  .a-rright{display:none}
  .has-res .a-rp{display:none}
  .has-res .a-rright{display:flex}
  .has-res .a-mapcard{display:none}
  .a-mtop label{display:none}
  .a-dates{flex-wrap:wrap}
  .a-checks.row{gap:10px;flex-wrap:wrap}
  .a-mh .a-agent{display:none}
}
@media (prefers-reduced-motion:reduce){.app *{animation:none !important;transition:none !important}}

  // перетаскивание, масштаб, координаты под курсором; view хранит центр и масштаб между перерисовками
  function mapCtl(host, view) {
    const svg = host.querySelector('svg.m'), mk = host.querySelector('.a-mk'), coord = host.querySelector('.a-mcoord');
    let box = [0, 0, 1, 1];
    function draw() {
      const w = host.clientWidth || 400, h = host.clientHeight || 300, W = w / view.z, H = h / view.z;

    let d = (closed ? ((k % 1) + 1) % 1 : clamp(k, 0, 1)) * L;

    if (reduced() || !SCRIPTS[name]) return;

      const cap = el.querySelector('.demo-cap'), app = el.querySelector('.app');

      b.onclick = () => { if (stopped) { stopped = false; set(); play(true); } else stop(); };
      cap.insertBefore(b, cap.querySelector('.hint')); set();
      // настоящий клик по экрану останавливает показ
      app.addEventListener('pointerdown', (e) => { if (e.isTrusted && !stopped) stop(); }, true);

    };
    function stop() { stopped = true; run++; el.querySelectorAll('.a-cursor').forEach((c) => c.remove()); const b = el.querySelector('.a-auto'); if (b) b._set(); }
    async function play(fresh) {
      const my = ++run;
      if (fresh) { f(el); ui(); }
      const app = el.querySelector('.app'); if (!app) return;
      const cur = document.createElement('div'); cur.className = 'a-cursor'; cur.innerHTML = CURSOR + '<i></i>'; app.appendChild(cur);
      let cx = app.clientWidth * .6, cy = app.clientHeight * .7; cur.style.transform = `translate(${cx}px,${cy}px)`;
      const live = () => { if (my !== run || !document.body.contains(app)) throw 0; };
      const find = (sel) => { const n = app.querySelector(sel); if (!n) throw 0; return n; };
      const move = async (n) => {
        n.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        const a = app.getBoundingClientRect(), r = n.getBoundingClientRect();
        cx = r.left - a.left + Math.min(r.width / 2, 40); cy = r.top - a.top + r.height / 2;
        if (!cur.isConnected) app.appendChild(cur);
        cur.style.transform = `translate(${cx}px,${cy}px)`; await sleep(650); live();
      };
      const tap = async () => { cur.classList.remove('tap'); void cur.offsetWidth; cur.classList.add('tap'); await sleep(180); live(); };
      try {
        for (const [op, sel, val] of SCRIPTS[name]()) {
          live();
          if (op === 'wait') { await sleep(sel); continue; }
          const n = find(sel); await move(n); await tap(); live();
          if (op === 'click') n.click();
          else if (op === 'ctx') { const r = n.getBoundingClientRect(); n.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: r.left + 60, clientY: r.top + r.height / 2 })); }
          else if (op === 'select') { n.focus({ preventScroll: true }); await sleep(250); live(); n.selectedIndex = val; n.dispatchEvent(new Event('change', { bubbles: true })); }
          else if (op === 'type') {
            n.focus({ preventScroll: true }); n.value = ''; n.dispatchEvent(new Event('input', { bubbles: true }));
            for (const ch of val) { await sleep(70); live(); n.value += ch; n.dispatchEvent(new Event('input', { bubbles: true })); }
          }
          await sleep(350);
        }
        // повтор, пока экран на виду
        live(); cur.remove();
        await new Promise((r) => { const io = new IntersectionObserver((es) => { if (es.some((x) => x.isIntersecting)) { io.disconnect(); r(); } }, { threshold: .4 }); io.observe(el); });
        live(); play(true);
      } catch (e) { if (e !== 0) console.error(e); if (cur.isConnected) cur.remove(); }
    }
    ui();
    const io = new IntersectionObserver((es) => { if (!seen && es.some((x) => x.isIntersecting)) { seen = true; io.disconnect(); if (!stopped) play(false); } }, { threshold: .4 });
    io.observe(el);
  }

  const DEMOS = { login: demoLogin, overview: demoOverview, object: demoObject, sensor: demoSensor, history: demoHistory, report: demoReport };

  };
  window.DEMO_I18N = DEMO_I18N;

      if (hits === ts.length || (ts.length > 2 && hits >= ts.length - 1)) res.push({ d, score: score + hits * 4 });
    }
    return { ts, res: res.sort((a, b) => b.score - a.score).slice(0, 25) };
  }
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function hl(text, ts) {
    let h = esc(text);
    for (const t of ts) h = h.replace(new RegExp('(' + reEsc(t).replace(/е/g, '[её]') + '[\\p{L}]*)', 'giu'), '<mark>$1</mark>');
    return h;
  }
  function snippet(d, ts) {
    let pos = -1; for (const t of ts) { pos = d.xl.indexOf(t); if (pos >= 0) break; }
    const st = Math.max(0, pos - 70);
    return (st ? '…' : '') + d.x.slice(st, st + 190) + (d.x.length > st + 190 ? '…' : '');
  }
  function renderResults(list, q) {
    if (!q.trim()) { list.innerHTML = ''; return; }
    if (!INDEX.length) { list.innerHTML = `<li class="empty">${esc(U().loadingSearch)}</li>`; return; }
    const { ts, res } = find(q, list.id === 'homeResults' && selTags.size ? hasTags : null);
    if (!res.length) { list.innerHTML = `<li class="empty">${esc(U().nothing)}</li>`; return; }
    list.innerHTML = res.map(({ d }, i) => `<li><a href="#${d.s}"${i ? '' : ' class="sel"'}><div class="c">${esc(d.c || U().docs)}</div><div class="t">${hl(d.t, ts)}</div><div class="x">${hl(snippet(d, ts), ts)}</div></a></li>`).join('');
  }
  function keyNav(input, list, onGo) {
    input.addEventListener('keydown', (e) => {
      const items = [...list.querySelectorAll('a')]; if (!items.length) return;
      let i = items.findIndex((a) => a.classList.contains('sel'));
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); if (i >= 0) items[i].classList.remove('sel');
        i = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items[i].classList.add('sel'); items[i].scrollIntoView({ block: 'nearest' });
      }
      if (e.key === 'Enter' && i >= 0) { e.preventDefault(); location.hash = items[i].getAttribute('href').slice(1); onGo && onGo(); }
    });
  }
  $('searchInput').addEventListener('input', () => renderResults($('searchResults'), $('searchInput').value));
  keyNav($('searchInput'), $('searchResults'), () => closeDlg($('search')));
  $('searchResults').addEventListener('click', (e) => { if (e.target.closest('a')) $('search').hidden = true; });
  // ---------- теги ----------
  const selTags = new Set();
  const tagIdx = (slug) => NAV.tags.indexOf(slug);
  const hasTags = (s) => [...selTags].every((i) => (NAV.meta[s].g || []).includes(i));
  function renderTags() {
    if (!NAV) return;
    // показываем только темы, которые встречаются вместе с уже выбранными
    const avail = NAV.tags.map((_, i) => NAV.order.filter((s) => hasTags(s) && (NAV.meta[s].g || []).includes(i)).length);
    $('tags').innerHTML = NAV.tags.map((slug, i) => (avail[i] || selTags.has(i)) ? `<button type="button" class="tag" data-tag="${i}" aria-pressed="${selTags.has(i)}">${esc(tagName(i))}<small>${avail[i]}</small></button>` : '').join('');
    $('tagsClear').hidden = !selTags.size;
  }
  $('tags').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tag]'); if (!b) return;
    const i = +b.dataset.tag; selTags.has(i) ? selTags.delete(i) : selTags.add(i);
    renderTags(); homeQuery();
    const hits = $('homeResults').querySelectorAll('a');
    if (selTags.size && !$('homeInput').value.trim() && hits.length === 1) location.hash = hits[0].getAttribute('href');
  });
  $('tagsClear').onclick = () => { selTags.clear(); renderTags(); homeQuery(); };
  function tagResults(list) {
    const res = NAV.order.filter(hasTags);
    if (!res.length) { list.innerHTML = `<li class="empty">${esc(U().noTagged)}</li>`; return; }
    list.innerHTML = res.map((s, i) => { const m = NAV.meta[s]; return `<li><a href="#${s}"${i ? '' : ' class="sel"'}><div class="c">${esc(m.c.map(title).join(' › ') || U().docs)}</div><div class="t">${esc(title(s))}</div><div class="x">${m.g.map((g) => esc(tagName(g))).join(' · ')}</div></a></li>`; }).join('');
  }
  function homeQuery() {
    const q = $('homeInput').value;
    if (!q.trim() && selTags.size && NAV) tagResults($('homeResults'));
    else renderResults($('homeResults'), q);
    $('home').classList.toggle('has-query', !!q.trim() || selTags.size > 0);
    $('home').classList.toggle('has-tags', selTags.size > 0);
  }
  $('homeInput').addEventListener('input', homeQuery);
  $('homeForm').addEventListener('submit', (e) => { e.preventDefault(); const a = $('homeResults').querySelector('a.sel'); if (a) location.hash = a.getAttribute('href').slice(1); });
  keyNav($('homeInput'), $('homeResults'));

  // ---------- маршрутизация ----------
  let current = null;
  async function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    if (!NAV) return;
    if (slug && slug.startsWith('tag-') && tagIdx(slug.slice(4)) >= 0) { selTags.clear(); selTags.add(tagIdx(slug.slice(4))); $('homeInput').value = ''; renderTags(); showHome(); homeQuery(); return; }
    if (!slug || !NAV.meta[slug]) return showHome();
    document.body.classList.remove('is-home');
    $('home').hidden = true; $('doc').hidden = false;
    if (current === slug) return;
    current = slug;
    const m = NAV.meta[slug];
    document.title = title(slug) + ' — PILOT';
    $('title').textContent = title(slug);
    $('artTags').innerHTML = (m.g || []).map((g) => `<a class="tag" href="#tag-${NAV.tags[g]}">${esc(tagName(g))}</a>`).join('');
    $('fallback').textContent = LN.fb.includes(slug) ? U().fallback : '';
    $('crumbs').innerHTML = [`<a href="#">${esc(U().docs)}</a>`, ...m.c.map((k) => esc(title(k)))].join('<span aria-hidden="true">›</span>');
    $('body').innerHTML = `<p class="loading">${esc(U().loading)}</p>`;
    $('toc').innerHTML = '';
    markNav(slug);
    window.scrollTo(0, 0);
    let html;
    try { html = (await chunk(LN.k[slug]))[slug]; } catch (e) { html = `<p>${esc(U().loadFail)}</p>`; }
    if (current !== slug) return;
    $('body').innerHTML = html || `<p class="loading">${esc(U().empty)}</p>`;
    fillImgs($('body'));
    $('body').querySelectorAll('table').forEach((t) => { if (!t.parentElement.classList.contains('tbl')) { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); } });
    if (window.mountDemos) window.mountDemos($('body'));
    let i = 0;
    const hs = [...$('body').querySelectorAll('h2, h3')];
    hs.forEach((h) => { h.id = 'h' + (++i); });
    const h2 = hs.filter((h) => h.tagName === 'H2');
    const list = h2.length >= 2 ? hs : [];
    $('toc').innerHTML = list.length ? `<b>${esc(U().onPage)}</b>` + list.map((h) => `<a class="${h.tagName.toLowerCase()}" href="#${slug}" data-to="${h.id}">${esc(h.textContent)}</a>`).join('') : '';
    const idx = NAV.order.indexOf(slug), prev = NAV.order[idx - 1], next = NAV.order[idx + 1];
    $('pager').innerHTML = (prev ? `<a href="#${prev}"><small>${esc(U().prev)}</small>${esc(title(prev))}</a>` : '') +
      (next ? `<a class="next" href="#${next}"><small>${esc(U().next)}</small>${esc(title(next))}</a>` : '');
  }
  function markNav(slug) {
    $('nav').querySelectorAll('a.active').forEach((a) => { a.classList.remove('active'); a.removeAttribute('aria-current'); });
    const a = $('nav').querySelector(`a[data-slug="${CSS.escape(slug)}"]`);
    if (!a) return;
    a.classList.add('active'); a.setAttribute('aria-current', 'page');
    for (let li = a.closest('li'); li; li = li.parentElement.closest('li')) li.classList.add('open');
    const sb = $('sidebar'), r = a.getBoundingClientRect(), s = sb.getBoundingClientRect();
    if (r.top < s.top || r.bottom > s.bottom) sb.scrollTop += r.top - s.top - s.height / 3;
  }
  function showHome() {
    current = null;
    document.title = U().title;
    document.body.classList.add('is-home');
    $('doc').hidden = true; $('home').hidden = false;
  }
  // переходы по заголовкам внутри статьи без смены адреса
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-to], a[data-anchor]');
    if (a) {
      e.preventDefault();
      const el = a.dataset.to ? $(a.dataset.to) : document.getElementsByName(a.dataset.anchor)[0];
      if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    const img = e.target.closest('.body img');
    if (img) { $('lightboxImg').src = img.src; $('lightboxImg').alt = img.alt; openDlg($('lightbox')); }
  });
  $('logo').addEventListener('click', (e) => { e.preventDefault(); location.hash = ''; showHome(); });
  window.addEventListener('hashchange', route);

  // поиск в шапке начинается ровно по левому краю текста статьи
  const inner = document.querySelector('.article-inner');
  function alignSearch() {
    const btn = $('searchBtn'), ver = document.querySelector('.ver');
    const rtl = root.dir === 'rtl';
    btn.style.marginLeft = ''; btn.style.marginRight = '';
    if ($('doc').hidden || innerWidth <= 820) return;
    const ir = inner.getBoundingClientRect(), vr = ver.getBoundingClientRect();
    const shift = rtl ? vr.left - ir.right - 12 : ir.left - vr.right - 12;
    btn.style[rtl ? 'marginRight' : 'marginLeft'] = Math.max(12, shift) + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(alignSearch).observe(inner);
  window.addEventListener('resize', alignSearch);
  window.addEventListener('hashchange', () => requestAnimationFrame(alignSearch));

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (!$('home').hidden) $('homeInput').focus(); else { openDlg($('search')); $('searchInput').select(); }
    }
    if (e.key === 'Escape') { document.querySelectorAll('.dialog:not([hidden])').forEach(closeDlg); document.body.classList.remove('nav-open'); }
  });

  // ---------- старт ----------
  document.body.classList.add('is-home');
  $('chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) { $('homeInput').value = c.textContent; homeQuery(); $('homeInput').focus(); } });

  // смена языка перерисовывает меню, главную и открытую статью
  function loadLang() {
    applyStatic();
    const lang = LANG;
    SEARCH = null; INDEX = [];
    return Promise.all([NAV || loadJSON('data/nav.json'), loadJSON(`data/${lang}/nav.json`)]).then(([nav, ln]) => {
      if (lang !== LANG) return;
      NAV = nav; LN = ln;
      $('nav').innerHTML = buildNav(nav.tree);
      $('lead').textContent = U().lead(nav.order.length);
      $('tiles').innerHTML = nav.tree.filter((t) => t.c && t.c.length).map((t) => `<a class="tile" href="#${t.s || firstSlug(t)}"><b>${esc(title(t.k))}</b><small>${esc(U().count(countPages(t)))}</small></a>`).join('');
      renderTags();
      current = null; route(); requestAnimationFrame(alignSearch);
      return loadJSON(`data/${lang}/search.json`).then((s) => { if (lang !== LANG) return; SEARCH = s; prepareIndex(); homeQuery(); });
    }).catch(() => { $('lead').textContent = U().failAll; });
  }
  loadLang();
})();
</script>
